name: Publish website and tutor knowledge
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test test/tutor.test.mjs
      - run: node scripts/build-knowledge.mjs .
      - run: |
          mkdir _site
          cp index.html framework-data.js learning-data.js assistant.js assistant.css assistant-config.js dashboard.css dashboard.js diagram-theme.css knowledge.json .nojekyll _site/
          cp -r views _site/views
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
