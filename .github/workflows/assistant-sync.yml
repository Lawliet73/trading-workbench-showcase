name: Sync approved assistant knowledge
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [framework-data.js, learning-data.js, README.md, assistant-knowledge.json, scripts/sync.mjs]
permissions:
  contents: read
concurrency:
  group: public-assistant-sync
  cancel-in-progress: false
jobs:
  sync:
    if: vars.ASSISTANT_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/sync.mjs . assistant-knowledge.json
        env:
          SYNC_URL: ${{ secrets.ASSISTANT_SYNC_URL }}
          SYNC_TOKEN: ${{ secrets.ASSISTANT_SYNC_TOKEN }}
